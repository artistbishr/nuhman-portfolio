<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #00d2ff;
            --accent-teal: #2dd4bf;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #ffffff;
            --text-dim: #8892b0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 95%;
            max-width: 1200px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative; 
            overflow: hidden;
        }

        /* Navigation */
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-home {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-nav {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 25px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-nav a { color: var(--text-dim); text-decoration: none; font-size: 1.1rem; }

        /* Header Style */
        .gallery-header { margin-bottom: 35px; }
        .sub-header-tag {
            color: var(--accent-teal);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }
        .gallery-header h1 { font-size: 2.2rem; margin: 0; font-weight: 700; line-height: 1.2; }
        .glow-text {
            color: var(--primary-blue);
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        }

        /* Masonry Grid */
        .masonry-wrapper { max-height: 550px; overflow-y: auto; padding-right: 15px; }
        .design-stack { column-count: 4; column-gap: 20px; }
        .design-item { break-inside: avoid; margin-bottom: 20px; position: relative; cursor: pointer; }
        .design-item img { width: 100%; border-radius: 18px; transition: 0.3s; }
        .design-item:hover img { transform: scale(1.02); }

        /* Remove Button */
        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(244, 63, 94, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: 0.3s;
            z-index: 5;
        }
        .design-item:hover .remove-btn { opacity: 1; }

        /* Floating Plus Button */
        .plus-upload-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 60px;
            height: 60px;
            border: 2px solid var(--primary-blue);
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary-blue);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            z-index: 10;
        }

        /* FULL SIZE MODAL STYLES */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .close-modal {
            position: absolute;
            top: 30px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .masonry-wrapper::-webkit-scrollbar { width: 5px; }
        .masonry-wrapper::-webkit-scrollbar-thumb { background: var(--primary-blue); border-radius: 10px; }
        @media (max-width: 900px) { .design-stack { column-count: 2; } }
    </style>
</head>

        <input type="file" id="fileInput" hidden accept="image/*" multiple>
        <div class="plus-upload-btn" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-plus"></i>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="imageModal" class="image-modal" onclick="this.style.display='none'">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="fullSizeImg">
    </div>

    <script>
        // Handle File Upload
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            for (let i = 0; i < files.length; i++) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const div = document.createElement('div');
                    div.className = 'design-item';
                    div.innerHTML = `
                        <button class="remove-btn" onclick="event.stopPropagation(); this.parentElement.remove()">
                            <i class="fas fa-times"></i>
                        </button>
                        <img src="${event.target.result}" alt="Preview" onclick="openFullSize(this.src)">
                    `;
                    document.getElementById('designStack').prepend(div);
                }
                reader.readAsDataURL(files[i]);
            }
        });

        // Function to open image in full size
        function openFullSize(imgSrc) {
            const modal = document.getElementById('imageModal');
            const fullImg = document.getElementById('fullSizeImg');
            modal.style.display = "flex";
            fullImg.src = imgSrc;
        }
    </script>
